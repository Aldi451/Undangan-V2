<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generator Link Tamu</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; max-width: 500px; margin: auto; }
        input, button { padding: 10px; width: 100%; margin-bottom: 15px; box-sizing: border-box; }
        textarea { width: 100%; height: 100px; padding: 10px; }
    </style>
</head>
<body>

    <h2>Buat Link Undangan Tamu</h2>
    
    <label>URL Website Undangan Lu (Contoh: https://undangan-gw.com/):</label>
    <input type="text" id="baseUrl" value="http://localhost/undangan/">

    <label>Nama Tamu:</label>
    <input type="text" id="namaTamu" placeholder="Contoh: Budi Santoso & Partner">

    <button onclick="buatLink()">Generate Link WhatsApp</button>

    <label>Hasil Link (Copy lalu kirim):</label>
    <textarea id="hasilLink" readonly></textarea>

    <script>
        function buatLink() {
            const baseUrl = document.getElementById('baseUrl').value;
            const nama = document.getElementById('namaTamu').value;
            
            if(!nama) {
                alert('Isi nama tamu dulu!');
                return;
            }

            // Encode karakter spesial (spasi jadi %20, dll)
            const namaEncoded = encodeURIComponent(nama);
            const linkLengkap = baseUrl + "?to=" + namaEncoded;
            
            // Template kalimat buat dikirim ke WA
            const pesanWA = `Tanpa mengurangi rasa hormat, perkenankan kami mengundang Bapak/Ibu/Saudara/i ${nama} untuk hadir di acara pernikahan kami.\n\nDetail undangan dapat diakses melalui link berikut:\n${linkLengkap}\n\nTerima kasih.`;
            
            document.getElementById('hasilLink').value = pesanWA;
        }
    </script>
</body>
</html>
